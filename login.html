{% extends "base.html" %}
{% block title %}Login — CyberAuth Toolkit{% endblock %}
{% block content %}
<section class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Log in to access your secure dashboard.</p>

        <form method="POST" action="{{ url_for('login') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ username }}"
                       placeholder="Your username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password"
                           placeholder="Your password" required>
                    <button type="button" class="toggle-visibility" data-target="password">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
</section>
{% endblock %}
